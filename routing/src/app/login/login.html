<div class="container">
  <h1>Login</h1>
  
  <form class="login-box">
    <div class="form-group">
      <label>Username</label>
      <input type="text" placeholder="Enter username" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" placeholder="Enter password" />
    </div>

    <button type="submit">Login</button>
  </form>
</div>
