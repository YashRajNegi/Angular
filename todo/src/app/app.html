<div class="todo-app">
  <h1>Todo App</h1>

  <div class="task-form">
    <input type="text" [(ngModel)]="todo" placeholder="Add a task" />
    <button (click)="addTask()">Add Task</button>
  </div>

  <ul class="task-list">
    @for (task of taskList; track task.id) {
      <li class="task-item">
        <span class="task-id">{{ task.id }}</span>
        <span class="task-text">{{ task.task }}</span>
        <button class="delete-btn" (click)="deleteTask(task.id)">Delete</button>
      </li>
    }
  </ul>
</div>
